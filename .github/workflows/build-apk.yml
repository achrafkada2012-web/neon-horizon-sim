name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Hard-Fix Index HTML Paths (إصلاح مسار التشغيل الرئيسي قطرياً)
        run: |
          # التحقق من وجود مجلد src لضمان سلامة البنية
          if [ ! -d "src" ]; then mkdir src; fi
          
          # التحقق من حالة الأحرف للملف الرئيسي وتوحيدها
          if [ -f "src/Main.tsx" ]; then mv src/Main.tsx src/main.tsx; fi
          if [ -f "src/Main.ts" ]; then mv src/Main.ts src/main.tsx; fi
          
          # إعادة كتابة سطر السكربت في index.html ليكون صحيحاً بنسبة 100% بنقطة واحدة فقط
          sed -i 's|src=".*main.tsx"|src="./src/main.tsx"|g' index.html || true
          sed -i 's|src=".*Main.tsx"|src="./src/main.tsx"|g' index.html || true

      - name: Install Dependencies via Bun
        run: |
          bun install
          bun add @capacitor/core @capacitor/cli @capacitor/android

      - name: Build React App
        run: |
          export VITE_CONFIG_NATIVE_IGNORE_WARNING=true
          bun run build

      - name: Initialize Capacitor Android
        run: |
          npx cap init "Neon Horizon: NYC Off-Grid" "com.neonhorizon.nycgrid" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK via Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Horizon-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
