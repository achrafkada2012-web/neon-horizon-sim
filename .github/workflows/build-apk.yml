name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies via Bun
        run: |
          bun install
          bun add @capacitor/core @capacitor/cli @capacitor/android

      - name: Build React App
        run: bun run build

      - name: Initialize Capacitor Android
        run: |
          npx cap init "Neon Horizon: NYC Off-Grid" "com.neonhorizon.nycgrid" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK via Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Horizon-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
