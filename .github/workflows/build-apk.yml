name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Inspect Repository Structure (للتشخيص وحل المسارات)
        run: |
          echo "=== Root Folder Content ==="
          ls -la
          echo "=== Src Folder Content ==="
          ls -la src || echo "src folder not found at root"

      - name: Repair Index and Main Paths (إصلاح تلقائي للمسارات الصارمة)
        run: |
          # التحقق من حالة الأحرف وضمان مطابقة الملفات لمتطلبات Vite
          if [ -f "src/Main.tsx" ]; then mv src/Main.tsx src/main.tsx; fi
          if [ -f "src/Main.ts" ]; then mv src/Main.ts src/main.tsx; fi
          # تعديل ملف index.html برمجياً للتأكد من استخدام المسار الصحيح
          sed -i 's|/src/main.tsx|./src/main.tsx|g' index.html || true
          sed -i 's|/src/Main.tsx|./src/main.tsx|g' index.html || true

      - name: Install Dependencies via Bun
        run: |
          bun install
          bun add @capacitor/core @capacitor/cli @capacitor/android

      - name: Build React App
        run: |
          export VITE_CONFIG_NATIVE_IGNORE_WARNING=true
          bun run build

      - name: Initialize Capacitor Android
        run: |
          npx cap init "Neon Horizon: NYC Off-Grid" "com.neonhorizon.nycgrid" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK via Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Horizon-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
